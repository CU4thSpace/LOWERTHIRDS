<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
<!-- ===== CHANGE STYLING of the LOWER THIRDS THEMSELVES AT THE CSS STYLESHEET ===== -->
<link rel="stylesheet" href="https://cu4thspace.github.io/LOWERTHIRDS/LOWERTHIRDStyle.css">
<title>4thSpace Lower Thirds – BrightSign</title>

<style>
/* ===== GLOBAL (kept inline so the green screen always renders) ===== */
html, body {
  width: 1920px;
  height: 1080px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #00FF00;
}

/* ===== CONTAINER ===== */
.event-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* ===== DEBUG ===== */
#debug {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.8);
  color: #0f0;
  padding: 10px;
  font-family: monospace;
  font-size: 14px;
  white-space: pre-line;
  z-index: 1000;
}

/* ===== TITLE + EDIT NOTE ===== */
#pageinfo {
  position: absolute;
  top: 10px;
  right: 10px;
  max-width: 900px;
  text-align: right;
  color: #000;
  padding: 10px;
  font-family: monospace;
  font-size: 14px;
  z-index: 1000;
}
#pageinfo .info-title {
  font-weight: bold;
  margin-bottom: 6px;
}
#pageinfo a {
  color: #000;
  text-decoration: underline;
  word-break: break-all;
}
</style>
</head>

<body>

<div id="debug">READY — Forward arrow (→) advances to the next Lower Thirds name.
Back arrow (←) returns to the TODAY card.</div>

<div id="pageinfo">
  <div class="info-title">4thSpace LOWER THIRDS</div>
  <div>Connect to this URL in order to edit Lower Thirds:</div>
  <a href="https://docs.google.com/spreadsheets/d/16c9DD4OHy1SITcF7lJtH7e49ol6SxN9A_8kBAdCOzsQ/edit?gid=0#gid=0">https://docs.google.com/spreadsheets/d/16c9DD4OHy1SITcF7lJtH7e49ol6SxN9A_8kBAdCOzsQ/edit?gid=0#gid=0</a>
</div>

<div class="event-container">
  <div id="lowerthird">
    <div class="name" id="name"></div>
    <div class="title" id="title"></div>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTBAMH4McS3-OHHgVUVqk_pt6WOhe0Jpp5ON2PbzyvGpGlF8kRHyt6JZlIQ0eN99kLkbpxl4la0ceWc/pub?output=csv";

/* Where the clicker's "back" button (ArrowLeft) should send the browser */
const CLICKER_BACK_URL = "https://cu4thspace.github.io/EVENTS/OBSCLOCKDATE";

/* Where numpad 8 sends the browser */
const EVENTS_PAGE_URL = "https://cu4thspace.github.io/EVENTS/TODAYKEYPADDER.html";

/* ===== FRESH NAVIGATION =====
 * Navigate to another page while forcing a fresh load on the BrightSign:
 *  - a unique query string makes every visit look like a brand-new URL
 *    (defeats HTTP cache and back/forward-cache reuse)
 *  - location.replace() avoids stacking history entries
 */
function goFresh(baseUrl) {
  const url = new URL(baseUrl);
  url.searchParams.set('_', Date.now());
  window.location.replace(url.toString());
}

/* If the browser restores this page from the back/forward cache, force a real reload */
window.addEventListener('pageshow', function(e) {
  if (e.persisted) location.reload();
});

/* ===== STATE ===== */
let entries = [];
let index   = -1;
let hasShownFirstEntry = false;

const lt       = document.getElementById("lowerthird");
const nameEl   = document.getElementById("name");
const titleEl  = document.getElementById("title");
const debugEl  = document.getElementById("debug");
const infoEl   = document.getElementById("pageinfo");

/* ===== DEBUG ===== */
function debug(msg) {
  console.log(msg);
  debugEl.textContent += '\n' + msg;
}

/* ===== CSV PARSER ===== */
function parseCSV(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  if (lines.length < 2) return [];

  function parseLine(line) {
    const fields = [];
    let field = '', inQ = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];

      if (ch === '"') {
        if (inQ && line[i+1] === '"') { field += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        fields.push(field.trim());
        field = '';
      } else {
        field += ch;
      }
    }

    fields.push(field.trim());
    return fields;
  }

  const headers = parseLine(lines[0]);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const vals = parseLine(line);
    const obj  = {};

    headers.forEach((h, idx) => {
      obj[h] = vals[idx] !== undefined ? vals[idx] : '';
    });

    rows.push(obj);
  }

  return rows;
}

/* ===== FIXED COLUMN MAPPING ===== */
function rowsToEntries(rows) {
  if (!rows.length) return [];

  const rawKeys = Object.keys(rows[0]);

  if (rawKeys.length < 2) {
    debug('ERROR: Need NAME + TITLE columns');
    return [];
  }

  const nameKey  = rawKeys[0];
  const titleKey = rawKeys[1];

  debug('Using NAME: ' + nameKey + ' | TITLE: ' + titleKey);

  return rows.map(r => ({
    name:  (r[nameKey] || '').trim(),
    title: (r[titleKey] || '').trim()
  }))
  .filter(e => e.name !== '');
}

/* ===== FETCH ===== */
/* Cache-busted CSV URL, rebuilt on every load so neither the browser nor the proxy serves a stale copy */
function freshCsvUrl() {
  return CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
}

async function fetchCSV(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

async function loadNames() {
  let csvText = null;
  const fresh = freshCsvUrl();

  try {
    csvText = await fetchCSV(fresh);
  } catch(e) {
    debug('Direct fetch failed');
  }

  if (!csvText) {
    try {
      csvText = await fetchCSV("https://corsproxy.io/?" + encodeURIComponent(fresh));
    } catch(e) {
      debug('Proxy failed');
    }
  }

  if (!csvText) {
    debug('FAILED TO LOAD CSV');
    entries = [{ name: "Sheet", title: "Load Failed" }];
    return;
  }

  const rows = parseCSV(csvText);
  entries = rowsToEntries(rows);

  debug('Loaded ' + entries.length + ' entries');
}

/* ===== DISPLAY ===== */
function showEntry(i) {
  if (!entries.length) return;

  index = (i + entries.length) % entries.length;

  nameEl.textContent  = entries[index].name;
  titleEl.textContent = entries[index].title;

  lt.classList.add("show");

  if (!hasShownFirstEntry) {
    debugEl.style.display = 'none';
    infoEl.style.display  = 'none';
    hasShownFirstEntry = true;
  }
}

function nextEntry() { showEntry(index + 1); }
function prevEntry() { showEntry(index - 1); }
function hideEntry() { lt.classList.remove("show"); }

/* ===== KEYBOARD INPUT =====
 *
 * PATH A — BrightSign XD1034 (e.keycode, non-standard lowercase property)
 *   50 = numpad 2 → reload page
 *   52 = numpad 4 → previous lower third
 *   54 = numpad 6 → next lower third
 *   56 = numpad 8 → navigate to Events page
 *
 * PATH B — Standard PC keyboard (e.key)
 *   ArrowRight        → next lower third
 *   ArrowLeft         → navigate to OBS clock/date page (clicker "back")
 *   ArrowDown         → hide lower third
 *   Shift+R           → reload page
 */
document.addEventListener("keydown", function(e) {
  // PATH A: BrightSign numpad keycodes
  switch (e.keycode) {
    case 52:
      e.preventDefault();
      prevEntry();
      return;
    case 54:
      e.preventDefault();
      nextEntry();
      return;
    case 56:
      e.preventDefault();
      goFresh(EVENTS_PAGE_URL);
      return;
    case 50:
      e.preventDefault();
      location.reload();
      return;
  }

  // PATH B: Standard PC keyboard
  switch (e.key) {
    case "ArrowRight":
      nextEntry();
      break;
    case "ArrowLeft":
      e.preventDefault();
      goFresh(CLICKER_BACK_URL);
      break;
    case "ArrowDown":
      hideEntry();
      break;
    case "R": case "r":
      if (e.shiftKey) location.reload();
      break;
  }
});

/* ===== INIT ===== */
loadNames().then(() => hideEntry());
</script>

</body>
</html>
