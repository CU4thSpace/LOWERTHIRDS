<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
<title>HTML Lower Third – BrightSign</title>

<style>
/* ===== GLOBAL ===== */
html, body {
  width: 1920px;
  height: 1080px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #00FF00;
  font-family: "gill-sans-nova-condensed", sans-serif;
}

/* ===== CONTAINER ===== */
.event-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* ===== LOWER THIRD ===== */
#lowerthird {
  position: absolute;
  left: 5.2%;
  bottom: 200px; /* fixed broadcast position */
  max-width: 72.9%;

  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;

  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

#lowerthird.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===== BOXED TEXT ===== */
.name, .title {
  display: inline-block;
  background-color: #2E3092;
  color: #ffffff;
  padding: 10px 16px;
  box-sizing: border-box;
  line-height: 1;
}

/* ===== NAME (independent control) ===== */
.name {
  font-size: 75px;   /* <-- adjust NAME size here */
  font-weight: bold;
}

/* ===== TITLE ===== */
.title {
  font-size: 52px;    /* <-- adjust TITLE size here */
  font-weight: 100;
}

/* ===== DEBUG ===== */
#debug {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.8);
  color: #0f0;
  padding: 10px;
  font-family: monospace;
  font-size: 14px;
  z-index: 1000;
}
</style>
</head>

<body>

<div id="debug">READY — Press → to advance</div>

<div class="event-container">
  <div id="lowerthird">
    <div class="name" id="name"></div>
    <div class="title" id="title"></div>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTBAMH4McS3-OHHgVUVqk_pt6WOhe0Jpp5ON2PbzyvGpGlF8kRHyt6JZlIQ0eN99kLkbpxl4la0ceWc/pub?output=csv";
const PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(CSV_URL);

/* ===== STATE ===== */
let entries = [];
let index   = -1;
let hasShownFirstEntry = false;

const lt      = document.getElementById("lowerthird");
const nameEl  = document.getElementById("name");
const titleEl = document.getElementById("title");
const debugEl = document.getElementById("debug");

/* ===== DEBUG ===== */
function debug(msg) {
  console.log(msg);
  debugEl.textContent += '\n' + msg;
}

/* ===== CSV PARSER ===== */
function parseCSV(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  if (lines.length < 2) return [];

  function parseLine(line) {
    const fields = [];
    let field = '', inQ = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];

      if (ch === '"') {
        if (inQ && line[i+1] === '"') { field += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        fields.push(field.trim());
        field = '';
      } else {
        field += ch;
      }
    }

    fields.push(field.trim());
    return fields;
  }

  const headers = parseLine(lines[0]);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const vals = parseLine(line);
    const obj  = {};

    headers.forEach((h, idx) => {
      obj[h] = vals[idx] !== undefined ? vals[idx] : '';
    });

    rows.push(obj);
  }

  return rows;
}

/* ===== FIXED COLUMN MAPPING ===== */
function rowsToEntries(rows) {
  if (!rows.length) return [];

  const rawKeys = Object.keys(rows[0]);

  if (rawKeys.length < 2) {
    debug('ERROR: Need NAME + TITLE columns');
    return [];
  }

  const nameKey  = rawKeys[0];
  const titleKey = rawKeys[1];

  debug('Using NAME: ' + nameKey + ' | TITLE: ' + titleKey);

  return rows.map(r => ({
    name:  (r[nameKey] || '').trim(),
    title: (r[titleKey] || '').trim()
  }))
  .filter(e => e.name !== '');
}

/* ===== FETCH ===== */
async function fetchCSV(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

async function loadNames() {
  let csvText = null;

  try {
    csvText = await fetchCSV(CSV_URL);
  } catch(e) {
    debug('Direct fetch failed');
  }

  if (!csvText) {
    try {
      csvText = await fetchCSV(PROXY_URL);
    } catch(e) {
      debug('Proxy failed');
    }
  }

  if (!csvText) {
    debug('FAILED TO LOAD CSV');
    entries = [{ name: "Sheet", title: "Load Failed" }];
    return;
  }

  const rows = parseCSV(csvText);
  entries = rowsToEntries(rows);

  debug('Loaded ' + entries.length + ' entries');
}

/* ===== DISPLAY ===== */
function showEntry(i) {
  if (!entries.length) return;

  index = (i + entries.length) % entries.length;

  nameEl.textContent  = entries[index].name;
  titleEl.textContent = entries[index].title;

  lt.classList.add("show");

  if (!hasShownFirstEntry) {
    debugEl.style.display = 'none';
    hasShownFirstEntry = true;
  }
}

function nextEntry() { showEntry(index + 1); }
function prevEntry() { showEntry(index - 1); }
function hideEntry() { lt.classList.remove("show"); }

/* ===== KEYBOARD ===== */
document.addEventListener("keydown", e => {
  switch (e.key) {
    case "ArrowRight": nextEntry(); break;
    case "ArrowLeft":  prevEntry(); break;
    case "ArrowDown":  hideEntry(); break;
    case "R": case "r":
      if (e.shiftKey) location.reload();
      break;
  }
});

/* ===== INIT ===== */
loadNames().then(() => hideEntry());
</script>

</body>
</html>
